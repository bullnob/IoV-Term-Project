[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iov-graph-offloading"
version = "0.1.0"
description = "An executable, documented CG-LyMADDPG offloading research prototype"
requires-python = ">=3.12,<3.16"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "torch==2.15.0+cpu",
  "matplotlib>=3.10,<4",
]

[project.scripts]
iov = "iov.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iov = ["web/*.html"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

